# Thresholds for a good hour (FR-1.3) and a window (FR-1.4). Knots.
min_wind: 10
max_wind: 40
max_gust: 45
ideal_wind: 20
min_window_hours: 2
daylight_margin_minutes: 30

# Shore break warning (FR-4.3). Metres and seconds; spots can override the wave heights.
watch_wave_m: 0.8
danger_wave_m: 1.5
long_period_s: 10

# How far ahead: the site shows forecast_days (today + 3), alerts only cover
# alert_days (today and tomorrow), since longer forecasts move too much.
forecast_days: 4
alert_days: 2
