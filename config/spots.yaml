# to the second (N = 0, E = 90, S = 180, W = 270). See docs/specs/wing-alert.md.
# Optional: worse_at (high | low | none) = the tide when the shore break is worse;
# watch_wave_m / danger_wave_m override the shore break wave heights for a spot.
# wind_at: where the wind is read, a sea point 3–5 km out. The model's beach cell
