[project]
name = "wing-alert"
version = "0.1.0"
description = "Wingfoiling conditions for the Wicklow coast"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "markdown>=3.11.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=wing_alert --cov-report=term-missing -m 'not live'"
markers = ["live: hits real APIs, run by hand"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
