name: daily

on:
  # The Cloudflare Worker in trigger/ starts the jobs on time through
  # workflow_dispatch (spec slice 7). GitHub's cron is often hours late, so it is
  # only a backup for the daily job: state.json stops repeat alerts (FR-1.12).
  schedule:
    - cron: "47 6 * * *"
    - cron: "47 16 * * *"
  workflow_dispatch:
    inputs:
      job:
        type: choice
        options: [daily, weekly]
        default: daily

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --no-dev
      - name: Check the wind, archive it, send alerts
        if: inputs.job != 'weekly'
        run: uv run python -m wing_alert
        env:
          WHATSAPP_RECIPIENTS: ${{ secrets.WHATSAPP_RECIPIENTS }}
      - name: Weekly summary
        if: inputs.job == 'weekly'
        run: uv run python -m wing_alert.weekly
        env:
          WHATSAPP_RECIPIENTS: ${{ secrets.WHATSAPP_RECIPIENTS }}
      - name: Commit data and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          [ -f state.json ] && git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "Data $(date -u +%Y-%m-%dT%H:%M)"
          # A PR merged while this job ran would make a plain push fail.
          # The run only touches data/ and state.json, so rebasing is safe.
          git pull --rebase --autostash
          git push
      - name: Build the site
        run: uv run python -m wing_alert.site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      # Pages sometimes hangs in "updating_pages"; the data is already pushed (FR-2.9).
      - name: Retry the Pages deploy
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
